[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotter-line-drawing-svg"
version = "0.1.0"
description = "Convert solved plotter color plates into line-drawing SVG mark fields."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Reid Surmeier" }]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/ReidSurmeier/plotter-line-drawing-svg"
Documentation = "https://github.com/ReidSurmeier/plotter-line-drawing-svg/blob/main/docs/animation-workflow.md"
Issues = "https://github.com/ReidSurmeier/plotter-line-drawing-svg/issues"
Source = "https://github.com/ReidSurmeier/plotter-line-drawing-svg"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
paper = ["matplotlib>=3.8", "scikit-image>=0.22", "scipy>=1.11"]

[project.scripts]
plotter-line-svg = "plotter_line_drawing_svg.cli:main"
plotter-line-svg-animate = "plotter_line_drawing_svg.svg_animation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plotter_line_drawing_svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
